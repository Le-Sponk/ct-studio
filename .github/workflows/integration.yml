name: Integration

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # UTC; avoid the start-of-hour queue.
  push:
    branches: [main]
    paths:
      - .github/workflows/integration.yml
      - scripts/ci_network.py
      - scripts/bootstrap_tools.py
      - scripts/tool_catalogue.py
      - tests/integration/expected_skips.toml
      - scripts/wine_rszst.py
      - scripts/tool_paths.py
      # What the real-tool tests exercise (P2-GATE): a change runs them, not only the nightly.
      - src/ctstudio/core/tools/**
      - src/ctstudio/core/errors.py
      - src/ctstudio/cli/**
      - tests/integration/**
      - tests/fakes/**
      - scripts/fixtures/**

permissions:
  contents: read

# P2-T08a: real tools from scripts/bootstrap_tools.py, generated fixtures, then every
# integration and network test that is not marked slow. A skip is green only when
# tests/integration/expected_skips.toml lists it for this OS with its reason; an
# unlisted skip, a failure, or a listed skip that stopped happening is red (ADR-022).
jobs:
  integration:
    name: Integration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      CTSTUDIO_RSZST_WINE: '1' # Linux: run rszst.exe through Wine (P2-T06e)
      WINEDEBUG: '-all'
      CTSTUDIO_CI_NO_GPU: '1' # skips editor-window tests that need a real GPU desktop
    steps:
      - name: Check out code and add-on
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install Linux Qt, Blender and Wine runtime
        if: runner.os == 'Linux'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libfontconfig1 libxcb-cursor0 libxkbcommon-x11-0 \
            fonts-dejavu-core libxi6 libxxf86vm1 libxfixes3 libxrender1 libsm6 \
            libxkbcommon0 libx11-6 wine wine64
          wine --version
      - name: Install uv with lockfile cache
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.19'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned Python
        run: uv python install 3.12
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Restore tool downloads
        uses: actions/cache@v4
        with:
          path: .tools/_downloads
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tool_catalogue.py') }}
      - name: Bootstrap Wiimms, Blender and ABMatt
        run: uv run python scripts/bootstrap_tools.py
      - name: Bootstrap the RiiStudio release (Windows)
        if: runner.os == 'Windows'
        run: uv run python scripts/bootstrap_tools.py --only riistudio
      - name: Set the RiiStudio release up through Wine (Linux)
        if: runner.os == 'Linux'
        run: uv run python scripts/wine_rszst.py
      - name: Generate fixtures
        run: uv run python scripts/fixtures/make_fixtures.py
      - name: Generate S2 Blender outputs
        run: uv run python spikes/s2_blender.py
      - name: Run integration and network tests
        run: >-
          uv run pytest -m "(integration or network) and not slow and not realdata" tests -rs
          --junitxml=tests/artifacts/integration.xml
      - name: Report every skip against the expected list
        if: always()
        run: >-
          uv run python scripts/ci_network.py tests/artifacts/integration.xml
          --expected tests/integration/expected_skips.toml
          --os ${{ runner.os == 'Windows' && 'windows' || 'linux' }}
      - name: Upload integration JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-${{ matrix.os }}
          path: tests/artifacts/integration.xml
          if-no-files-found: warn
