name: Record Linux tool outputs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/record-linux.yml

permissions:
  contents: read

# P2-T08b: record the pinned Linux tools' help, option index and operation outputs on the
# synthetic fixtures. Never pushes: a person downloads the artifact, reviews it and commits
# the linux-*.json files (TESTING_STRATEGY section 2). rszst and ABMatt ops need rszst
# through Wine in scripts/tool_paths.py first (P2-T08d).
jobs:
  record:
    name: Record (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out code and add-on
        uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install Blender runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libfontconfig1 libxi6 libxxf86vm1 libxfixes3 \
            libxrender1 libsm6 libxkbcommon0 libx11-6
      - name: Install uv with lockfile cache
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.19'
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install pinned Python
        run: uv python install 3.12
      - name: Sync locked dependencies
        run: uv sync --locked
      - name: Restore tool downloads
        uses: actions/cache@v4
        with:
          path: .tools/_downloads
          key: tools-${{ runner.os }}-${{ hashFiles('scripts/tool_catalogue.py') }}
      - name: Bootstrap Wiimms, Blender and ABMatt
        run: uv run python scripts/bootstrap_tools.py
      - name: Generate fixtures
        run: uv run python scripts/fixtures/make_fixtures.py
      - name: Record help and option indexes
        run: uv run python scripts/record_tool_help.py
      - name: Record operations
        run: uv run python scripts/record_tool_outputs.py --only wiimms-szs-tools --only blender
      - name: Show what changed
        if: always()
        run: git status --short tests/fakes/recordings
      - name: Upload Linux recordings
        uses: actions/upload-artifact@v4
        with:
          name: linux-recordings
          path: tests/fakes/recordings/**/linux-*.json
          if-no-files-found: error
