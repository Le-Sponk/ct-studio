# Pytest settings before P1-T01 creates pyproject.toml.
# P1-T02 folds these into the real config; keep the two in sync when it does.
# Markers match docs/process/TESTING_STRATEGY.md section 1.
[pytest]
testpaths = tests
markers =
    gui: needs a Qt application (runs offscreen)
    integration: needs real tools from .tools/
    slow: end-to-end, takes minutes
    realdata: needs the human's own files in local_fixtures/
    benchmark: performance measurement
