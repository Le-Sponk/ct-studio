# Ruff settings for scripts/ and tests/ before P1-T01 creates pyproject.toml.
# P1-T02 folds these into the real config; keep the two in sync when it does.
line-length = 100
target-version = "py312"

[lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF"]
# E402: scripts/ deliberately import from the scripts dir after extending sys.path.
ignore = ["E402"]

[lint.per-file-ignores]
# Tests assert; that is the point.
"tests/**" = ["S101"]

[format]
docstring-code-format = true
